name: Build and checks
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', '*.slnx', '*.props', '*.json', '.github/workflows/ci.yml']
  pull_request:
    paths: ['src/**', 'tests/**', '*.slnx', '*.props', '*.json', '.github/workflows/ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build PrivacyGuard.slnx -c Release
      - run: dotnet run --project tests/PrivacyGuard.Core.Checks -c Release --no-build
      - run: dotnet run --project src/PrivacyGuard.Cli -c Release --no-build -- capabilities
